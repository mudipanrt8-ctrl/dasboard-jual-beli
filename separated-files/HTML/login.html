<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TrendStyle E-Commerce</title>
    <link rel="stylesheet" href="../CSS/styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #5568d3;
        }
        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .role-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .role-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
            color: #667eea;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🔑 Login TrendStyle</h1>
            
            <div class="role-selector">
                <button class="role-btn active" onclick="selectRole('buyer')">🛍️ Pembeli</button>
                <button class="role-btn" onclick="selectRole('seller')">🏪 Penjual</button>
                <button class="role-btn" onclick="selectRole('admin')">👑 Admin</button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Pengguna</label>
                    <input type="email" id="emailInput" required placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label>Kata Sandi</label>
                    <input type="password" id="passwordInput" required placeholder="Masukkan password">
                </div>
                <input type="hidden" id="roleInput" value="buyer">
                <button type="submit" class="btn-login">Masuk Sekarang</button>
            </form>

            <div class="back-link">
                <a href="index.html">← Kembali ke Beranda</a>
            </div>
        </div>
    </div>

    <script src="../JavaScript/config.js"></script>
    <script src="../JavaScript/utils.js"></script>
    <script src="../JavaScript/auth.js"></script>
    <script>
        function selectRole(role) {
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('roleInput').value = role;
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const role = document.getElementById('roleInput').value;
            
            loginUser(email, password, role);
        }
    </script>
</body>
</html>
